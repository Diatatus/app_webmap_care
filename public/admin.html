<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Administrateur</title>
    <link rel="shortcut icon" href="./resources/images/care_logo.png" />
    <link rel="stylesheet" href="/node_modules/@fortawesome/fontawesome-free/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
  /* Variables CSS (inchangées, c'est bien de les avoir) */
:root {
    --primary-color: #e55b00; /* Bleu vibrant */
    --secondary-color: #6c757d; /* Gris foncé */
    --accent-color: #ffa500; /* Vert pour succès/actions */
    --background-light: #f8f9fa; /* Arrière-plan très clair */
    --background-dark: #343a40; /* Arrière-plan sombre pour le header/footer */
    --text-dark: #343a40; /* Texte foncé */
    --text-light: #ffffff; /* Texte clair */
    --border-color: #dee2e6; /* Couleur de bordure */
    --shadow-light: rgba(0, 0, 0, 0.08); /* Ombre légère */
    --border-radius: 8px;
}

/* Base Body et Header (inchangés, ils sont bien) */
body {
    font-family: 'Montserrat', sans-serif;
    background-color: var(--background-light);
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding-top: 60px; /* Espace pour le header fixe */
    color: var(--text-dark);
}

header {
    background-color: var(--background-dark);
    color: var(--text-light);
    padding: 10px 20px;
    text-align: center;
    position: fixed;
    width: 100%;
    top: 0;
    left: 0;
    z-index: 1000;
    box-shadow: 0 2px 4px var(--shadow-light);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 1.5em;
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;
    flex-grow: 1;
    text-align: left;
}

.logout-btn {
    background: none;
    border: none;
    color: var(--text-light);
    font-size: 1.1em;
    cursor: pointer;
    padding: 8px 15px;
    border-radius: var(--border-radius);
    transition: background-color 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-right: 10px;
}

.logout-btn:hover {
    background-color: rgba(255, 255, 255, 0.1);
    color: var(--primary-color); /* Utilisation de la variable */
}

/* Conteneur principal */
.container {
    flex: 1;
    width: 95%;
    max-width: 1400px;
    margin: 30px auto;
    background: var(--text-light);
    padding: 40px;
    border-radius: var(--border-radius);
    box-shadow: 0 4px 10px var(--shadow-light);
}

section {
    padding: 20px 0;
}

h2 {
    font-family: 'Open Sans', sans-serif;
    font-weight: 700;
    color: var(--primary-color);
    text-align: center;
    margin-bottom: 30px;
}

nav {
    margin: 20px 0 40px;
    text-align: center;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

nav button {
    padding: 12px 25px;
    background-color: var(--primary-color);
    border: none;
    color: var(--text-light);
    border-radius: var(--border-radius);
    cursor: pointer;
    font-size: 1em;
    font-weight: 500;
    transition: background-color 0.3s ease, transform 0.2s ease;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

nav button:hover {
    background-color: var(--accent-color); /* Utilisation de la variable pour une cohérence */
    transform: translateY(-2px);
}

nav button.active {
    background-color: var(--accent-color);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}

.hidden {
    display: none;
}

/* --- Section des tableaux - Améliorations ici --- */

#contentArea {
    flex: 1;
    /* overflow: hidden;  <-- Supprimez ou commentez ceci, il peut interférer avec sticky */
    display: flex;
    flex-direction: column;
}

.table-wrapper {
    flex: 1;
    overflow-x: auto; /* Permet le défilement horizontal */
    overflow-y: auto; /* Permet le défilement vertical */
    max-height: 500px; /* Hauteur maximale pour le défilement vertical, ajustez si besoin */
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    box-shadow: 0 2px 5px var(--shadow-light);
    background-color: var(--text-light);
    padding: 0; /* Important: retirez le padding ici pour que le tableau remplisse bien */
    position: relative; /* Très important pour positionner la colonne sticky par rapport à ce wrapper */
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1200px; /* Assure une largeur minimale pour le défilement si le contenu est petit */
    /* background-color: var(--text-light); */ /* Le background devrait être sur le thead/tr/td */
}

/* Styles des cellules et en-têtes de tableau */
th, td {
    padding: 12px 15px;
    border: 1px solid var(--border-color); /* Bordures fines */
    text-align: left;
    white-space: nowrap; /* Empêche le texte de se retourner */
    font-size: 0.9em;
    /* z-index: 0; <-- Supprimez ceci, il est par défaut à 0 et peut être source de confusion */
}

/* En-tête du tableau (fixe verticalement) */
th {
    background-color: var(--background-dark);
    color: var(--text-light);
    position: sticky; /* Fige l'en-tête */
    top: 0; /* Fige en haut du conteneur de défilement */
    z-index: 3; /* Plus élevé que les cellules de données et les cellules fixes */
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;
}

/* Lignes alternées pour une meilleure lisibilité */
tr:nth-child(even) {
    background-color: #f2f2f2;
}

/* Ligne au survol */
tr:hover {
    background-color: #e9ecef; /* Couleur de survol légère */
    transition: background-color 0.2s ease;
}

/* --- Colonne fixe "Actions" (Header et Cellules) --- */

/* Appliqué aux <th> et <td> avec la classe fixed-column */
.fixed-column {
    position: sticky;       /* La magie de la fixation ! */
    right: 0;               /* Colle la colonne au bord droit du 'table-wrapper' */
    background-color: var(--background-light); /* Couleur de fond pour cacher ce qui est dessous */
    z-index: 2;             /* Assure qu'elle est au-dessus des colonnes non fixes */
    box-shadow: -3px 0 8px rgba(0, 0, 0, 0.1); /* Ombre plus prononcée pour l'effet de profondeur */
    text-align: center;     /* Centre le contenu comme les boutons d'action */
    padding-right: 15px;    /* Assure un bon padding même avec l'ombre */
    padding-left: 15px;
    min-width: 100px; /* Assurez-vous que la colonne a une largeur suffisante pour les boutons */
}

/* Ajustement spécifique pour l'en-tête de la colonne fixe */
thead th.fixed-column {
    background-color: var(--background-dark); /* Garde la même couleur que les autres en-têtes */
    color: var(--text-light);
    z-index: 4; /* Le plus haut z-index pour s'assurer qu'il reste au-dessus de tout */
}


/* Styles pour les boutons d'action dans la colonne fixe */
.fixed-btn {
    background-color: var(--primary-color);
    color: var(--text-light);
    border: none;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9em;
    transition: background-color 0.3s ease, transform 0.2s ease;
    margin: 0 3px; /* Augmenté légèrement pour un meilleur espacement */
    display: inline-flex; /* Permet un meilleur alignement vertical des icônes */
    align-items: center;
    justify-content: center;
    gap: 5px; /* Espace entre l'icône et le texte si vous en avez */
}

.fixed-btn:hover {
    background-color: var(--accent-color); /* Utilisation de la variable */
    transform: translateY(-1px); /* Légère animation au survol */
}

/* Icônes dans les boutons */
.fixed-btn i {
    font-size: 1em; /* Ajustez la taille de l'icône si nécessaire */
}


/* --- Formulaires (inchangés, mais vérifiez les select et inputs datalist si utilisés) --- */
form {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 20px;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    background-color: var(--text-light);
    box-shadow: 0 2px 5px var(--shadow-light);
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.form-group label {
    font-weight: 600;
    color: var(--text-dark);
    font-size: 0.95em;
}

/* S'assurer que les inputs et selects ont des styles cohérents */
.form-group input[type="text"],
.form-group input[type="password"],
.form-group input[type="number"],
.form-group select, /* Ajoutez cette règle pour les éléments <select> */
.form-group textarea /* Ajoutez cette règle pour les éléments <textarea> */ {
    padding: 12px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    font-size: 1em;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    width: calc(100% - 24px); /* Prend toute la largeur moins le padding */
    box-sizing: border-box; /* Très important pour inclure padding et border dans la largeur */
}

.form-group input:focus,
.form-group select:focus, /* Ajoutez pour les selects */
.form-group textarea:focus /* Ajoutez pour les textareas */ {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
    outline: none;
}

/* Password wrapper (inchangé) */
.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 40px;
}

.password-toggle {
    position: absolute;
    top: 60%;
    right: 15px;
    transform: translateY(-50%);
    cursor: pointer;
    color: var(--secondary-color);
    transition: color 0.3s ease;
    font-size: 1.1em;
}

.password-toggle:hover {
    color: var(--primary-color);
}

form button[type="submit"] {
    padding: 12px 25px;
    background-color: var(--primary-color);
    border: none;
    color: var(--text-light);
    border-radius: var(--border-radius);
    cursor: pointer;
    font-size: 1.1em;
    font-weight: 600;
    transition: background-color 0.3s ease, transform 0.2s ease;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    margin-top: 20px;
}

form button[type="submit"]:hover {
    background-color: var(--accent-color); /* Utilisation de la variable */
    transform: translateY(-2px);
}

/* Styles pour Select2 (inchangés, ils sont spécifiques à la librairie) */
.select2-container--default .select2-selection--single {
    height: 44px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: flex;
    align-items: center;
}

.select2-container--default .select2-selection--single .select2-selection__rendered {
    line-height: 42px;
    padding-left: 12px;
}

.select2-container--default .select2-selection--single .select2-selection__arrow {
    height: 42px;
    right: 5px;
}

.select2-container--default.select2-container--focus .select2-selection--single {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
}

.select2-dropdown {
    border: 1px solid var(--border-color);
    border-radius: 4px;
    box-shadow: 0 2px 5px var(--shadow-light);
}

.select2-results__option {
    padding: 10px 12px;
}

.select2-results__option--highlighted[aria-selected] {
    background-color: var(--primary-color);
    color: var(--text-light);
}
    </style>
</head>
<body>
    <header>
        <h1>Espace Administrateur - Gestion des Données</h1>
        <button class="logout-btn" id="btnLogout">
            <i class="fas fa-power-off"></i> Déconnexion
        </button>
    </header>

    <div class="container">
        <section id="loginSection">
            <h2>Connexion</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur :</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group password-wrapper">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="password" required>
                    <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                </div>
                <button type="submit">Se connecter</button>
            </form>
        </section>

        <section id="adminInterface" class="hidden">
            <nav>
                <button id="btnListRegions">Régions</button>
                <button id="btnListPartners">Partenaires</button>
                <button id="btnListOffices">Bureaux de Base</button>
                <button id="btnListProjects">Projets</button>
            </nav>
            <div id="contentArea">
                <div class="table-wrapper">
                    </div>
            </div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePassword = document.getElementById('togglePassword');
            const passwordField = document.getElementById('password');

            togglePassword.addEventListener('click', () => {
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);
                togglePassword.classList.toggle('fa-eye');
                togglePassword.classList.toggle('fa-eye-slash');
            });

            // Gestion de la déconnexion
            const btnLogout = document.getElementById('btnLogout');
            btnLogout.addEventListener('click', async () => {
                const response = await fetch('/admin/api/logout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    window.location.href = 'localhost:3000/';
                } else {
                    alert('Erreur lors de la déconnexion.');
                }
            });

            // Gérer les boutons de navigation actifs
            const navButtons = document.querySelectorAll('nav button');
            navButtons.forEach(button => {
                button.addEventListener('click', () => {
                    navButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                });
            });

            // Définir le bouton "Régions" comme actif par défaut au chargement de l'interface admin
            const adminInterface = document.getElementById('adminInterface');
            const observer = new MutationObserver((mutationsList, observer) => {
                for (const mutation of mutationsList) {
                    if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                        if (!adminInterface.classList.contains('hidden')) {
                            document.getElementById('btnListRegions').classList.add('active');
                            observer.disconnect(); // Arrête d'observer une fois l'action effectuée
                        }
                    }
                }
            });
            observer.observe(adminInterface, { attributes: true });
        });
    </script>
    <script src="/admin.js"></script>
</body>
</html>
