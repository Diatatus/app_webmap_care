<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Administrateur</title>
    <link rel="shortcut icon" href="./resources/images/care_logo.png" />
    <link rel="stylesheet" href="/node_modules/@fortawesome/fontawesome-free/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
/* ================================================
   VERSION CSS: 3.0 - CHARTE GRAPHIQUE CARE
   MODIFICATION: 2025-11-12
   Interface épurée et professionnelle
   ================================================ */
/* ===== VARIABLES CSS - CHARTE GRAPHIQUE CARE ===== */
:root {
    /* Couleurs principales CARE */
    --primary-color: #e55b00;
    --primary-hover: #cc5000;
    --primary-light: #fff3e0;

    /* Couleurs neutres */
    --secondary-color: #6c757d;
    --secondary-hover: #5a6268;

    /* Couleurs fonctionnelles */
    --success-color: #28a745;
    --danger-color: #dc3545;
    --warning-color: #ffc107;
    --info-color: #17a2b8;

    /* Arrière-plans */
    --background-light: #f8f9fa;
    --background-white: #ffffff;
    --header-bg: #2c3e50;

    /* Texte */
    --text-dark: #333333;
    --text-light: #ffffff;
    --text-muted: #6c757d;

    /* Bordures */
    --border-color: #dee2e6;
    --border-light: #e9ecef;

    /* Ombres */
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 2px 4px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.12);
    --shadow-xl: 0 8px 16px rgba(0, 0, 0, 0.15);

    /* Rayons de bordure */
    --border-radius-sm: 4px;
    --border-radius: 6px;
    --border-radius-lg: 8px;

    /* Transitions */
    --transition-fast: 150ms ease;
    --transition-base: 250ms ease;
    --transition-slow: 350ms ease;
}

/* ===== RESET & BASE STYLES ===== */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Montserrat', sans-serif;
    background-image: url('./resources/images/care-social-image.webp');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding-top: 70px;
    color: var(--text-dark);
    line-height: 1.6;
    position: relative;
}

/* Overlay pour la page de connexion */
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.3);
    z-index: -1;
}

/* ===== HEADER ===== */
header {
    background: var(--header-bg);
    color: var(--text-light);
    padding: 0 30px;
    position: fixed;
    width: 100%;
    top: 0;
    left: 0;
    z-index: 1000;
    box-shadow: var(--shadow-md);
    height: 70px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo-container {
    width: 45px;
    height: 45px;
    background: var(--background-white);
    border-radius: var(--border-radius);
    padding: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

header h1 {
    margin: 0;
    font-size: 1.4em;
    font-family: 'Open Sans', sans-serif;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.header-subtitle {
    font-size: 0.75em;
    color: rgba(255, 255, 255, 0.7);
    font-weight: 400;
    margin-top: 2px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 20px;
}

.user-info {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 15px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: var(--border-radius);
}

.user-avatar {
    width: 35px;
    height: 35px;
    background: var(--primary-color);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 0.9em;
}

.logout-btn {
    background: var(--danger-color);
    border: none;
    color: var(--text-light);
    font-size: 0.95em;
    cursor: pointer;
    padding: 10px 20px;
    border-radius: var(--border-radius);
    transition: all var(--transition-base);
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
}

.logout-btn:hover {
    background: #c82333;
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
}

.logout-btn:active {
    transform: translateY(0);
}

/* ===== CONTENEUR PRINCIPAL ===== */
.container {
    flex: 1;
    width: 95%;
    max-width: 1600px;
    margin: 30px auto;
    padding: 0;
}

/* Quand l'utilisateur est connecté, fond uni et propre */
body:has(#adminInterface:not(.hidden)) {
    background-image: none !important;
    background: var(--background-light) !important;
}

body:has(#adminInterface:not(.hidden))::before {
    background: none !important;
}

section {
    padding: 0;
}

/* ===== PAGE LOGIN AVEC GLASSMORPHISM ===== */
#loginSection {
    max-width: 450px;
    margin: 80px auto;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 50px 40px;
    border-radius: var(--border-radius-lg);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.2);
    position: relative;
    overflow: hidden;
}

/* Effet de brillance subtil */
#loginSection::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
    animation: shine 6s ease-in-out infinite;
    pointer-events: none;
}

@keyframes shine {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(10%, 10%); }
}

#loginSection h2 {
    text-align: center;
    margin-bottom: 40px;
    font-size: 2em;
    color: var(--text-light);
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    position: relative;
    z-index: 1;
}

/* ===== NAVIGATION TABS ===== */
nav {
    margin: 0 0 25px 0;
    display: flex;
    gap: 10px;
    background: var(--background-white);
    padding: 15px;
    border-radius: var(--border-radius);
    box-shadow: var(--shadow-sm);
    flex-wrap: wrap;
    border: 1px solid var(--border-light);
}

nav button {
    flex: 1;
    min-width: 150px;
    padding: 12px 24px;
    background: var(--background-white);
    border: 1px solid var(--border-color);
    color: var(--text-dark);
    border-radius: var(--border-radius);
    cursor: pointer;
    font-size: 0.95em;
    font-weight: 600;
    transition: all var(--transition-base);
}

nav button:hover {
    background: var(--primary-light);
    border-color: var(--primary-color);
    transform: translateY(-1px);
}

nav button.active {
    background: var(--primary-color);
    color: var(--text-light);
    border-color: var(--primary-color);
}

nav button i {
    margin-right: 8px;
}

/* ===== CONTENT AREA ===== */
#contentArea {
    background: var(--background-white);
    padding: 25px;
    border-radius: var(--border-radius);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-light);
    min-height: 500px;
}

h2 {
    font-family: 'Open Sans', sans-serif;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 25px;
    font-size: 1.8em;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 15px;
    border-bottom: 3px solid var(--primary-color);
}

.add-btn {
    background: var(--success-color);
    border: none;
    color: var(--text-light);
    padding: 10px 20px;
    border-radius: var(--border-radius);
    cursor: pointer;
    font-size: 0.9em;
    font-weight: 600;
    transition: all var(--transition-base);
    display: flex;
    align-items: center;
    gap: 8px;
}

.add-btn:hover {
    background: #218838;
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
}

.hidden {
    display: none !important;
}

/* ===== LOADING SPINNER ===== */
.spinner {
    border: 3px solid rgba(0, 0, 0, 0.1);
    border-left-color: var(--primary-color);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 40px auto;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ===== SEARCH BAR ===== */
.search-container {
    margin-bottom: 20px;
    display: flex;
    gap: 15px;
    align-items: center;
    flex-wrap: wrap;
}

.search-box {
    flex: 1;
    min-width: 250px;
    position: relative;
}

.search-box input {
    width: 100%;
    padding: 12px 40px 12px 15px;
    border: 2px solid var(--border-color);
    border-radius: var(--border-radius);
    font-size: 0.95em;
    transition: all var(--transition-base);
}

.search-box input:focus {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(229, 91, 0, 0.1);
    outline: none;
}

.search-box i {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
}

/* ===== TABLEAUX AMÉLIORÉS ===== */
.table-wrapper {
    overflow-x: auto;
    overflow-y: auto;
    max-height: 600px;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    box-shadow: var(--shadow-sm);
    background-color: var(--card-background);
    position: relative;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    min-width: 1200px;
}

/* Styles des cellules et en-têtes de tableau */
th, td {
    padding: 15px 18px;
    text-align: left;
    white-space: nowrap;
    font-size: 0.9em;
    border-bottom: 1px solid var(--border-color);
}

/* En-tête du tableau */
th {
    background: var(--header-bg);
    color: var(--text-light);
    position: sticky;
    top: 0;
    z-index: 10;
    font-family: 'Open Sans', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.8em;
    letter-spacing: 0.5px;
}

th:first-child {
    border-radius: var(--border-radius) 0 0 0;
}

th:last-child {
    border-radius: 0 var(--border-radius) 0 0;
}

/* Lignes du tableau */
tbody tr {
    background-color: var(--background-white);
    transition: all var(--transition-fast);
}

tbody tr:nth-child(even) {
    background-color: var(--background-light);
}

tbody tr:hover {
    background-color: var(--primary-light);
}

td {
    color: var(--text-dark);
}

/* ===== COLONNE FIXE ACTIONS ===== */
.fixed-column {
    position: sticky;
    right: 0;
    background: var(--background-light);
    z-index: 5;
    box-shadow: -2px 0 4px rgba(0, 0, 0, 0.05);
    text-align: center;
    min-width: 120px;
}

thead th.fixed-column {
    background: var(--header-bg);
    color: var(--text-light);
    z-index: 15;
}

/* ===== BOUTONS D'ACTION ===== */
.editBtn,
.deleteBtn,
.fixed-btn {
    border: none;
    padding: 8px 12px;
    border-radius: var(--border-radius-sm);
    cursor: pointer;
    font-size: 0.85em;
    transition: all var(--transition-base);
    margin: 0 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 35px;
}

.editBtn {
    background: var(--info-color);
    color: var(--text-light);
}

.editBtn:hover {
    background: #138496;
    transform: translateY(-1px);
}

.deleteBtn {
    background: var(--danger-color);
    color: var(--text-light);
}

.deleteBtn:hover {
    background: #c82333;
    transform: translateY(-1px);
}

.fixed-btn {
    background: var(--primary-color);
    color: var(--text-light);
}

.fixed-btn:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
}

.editBtn i,
.deleteBtn i,
.fixed-btn i {
    font-size: 1em;
}


/* ===== FORMULAIRES ===== */
form {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    padding: 25px;
    border: 1px solid var(--border-light);
    border-radius: var(--border-radius);
    background: var(--background-white);
    box-shadow: var(--shadow-sm);
}

/* Exception pour le formulaire de connexion - disposition en colonne unique */
#loginForm {
    max-width: 450px;
    display: flex !important;
    flex-direction: column;
    gap: 25px;
}

#loginForm .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

#loginForm button[type="submit"] {
    width: 100%;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Formulaires spécifiques avec ID */
#addProjectForm,
#editProjectForm,
#addPartnerForm,
#editPartnerForm,
#editRegionForm {
    display: grid !important;
    grid-template-columns: repeat(3, 1fr) !important;
}

/* Formulaire en 3 colonnes pour grandes résolutions */
@media (min-width: 1200px) {
    form:not(#loginForm) {
        grid-template-columns: repeat(3, 1fr) !important;
    }

    #addProjectForm,
    #editProjectForm,
    #addPartnerForm,
    #editPartnerForm,
    #editRegionForm {
        grid-template-columns: repeat(3, 1fr) !important;
    }
}

/* Formulaire en 2 colonnes pour résolutions moyennes */
@media (min-width: 768px) and (max-width: 1199px) {
    form:not(#loginForm) {
        grid-template-columns: repeat(2, 1fr) !important;
    }

    #addProjectForm,
    #editProjectForm,
    #addPartnerForm,
    #editPartnerForm,
    #editRegionForm {
        grid-template-columns: repeat(2, 1fr) !important;
    }
}

/* Mobile - 1 colonne */
@media (max-width: 767px) {
    form:not(#loginForm) {
        grid-template-columns: 1fr !important;
    }

    #addProjectForm,
    #editProjectForm,
    #addPartnerForm,
    #editPartnerForm,
    #editRegionForm {
        grid-template-columns: 1fr !important;
    }
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

/* Sections de formulaire */
.form-section {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 20px;
    background: var(--primary-light);
    border-radius: var(--border-radius);
    border-left: 3px solid var(--primary-color);
}

@media (min-width: 768px) and (max-width: 1199px) {
    .form-section {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 767px) {
    .form-section {
        grid-template-columns: 1fr;
    }
}

.form-section-title {
    grid-column: 1 / -1;
    font-size: 1.1em;
    font-weight: 600;
    color: var(--primary-color);
    margin: 0;
    padding-bottom: 10px;
    border-bottom: 2px solid rgba(229, 91, 0, 0.2);
    display: flex;
    align-items: center;
    gap: 8px;
}

.form-section-title i {
    font-size: 1em;
}

/* Boutons de formulaire occupent toute la largeur */
.form-actions {
    grid-column: 1 / -1;
    display: flex;
    gap: 15px;
    justify-content: flex-end;
    margin-top: 10px;
    padding-top: 20px;
    border-top: 2px solid var(--border-color);
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 72px;
}

.form-group.full-width,
.form-group.select-multiple {
    min-height: auto;
}

.form-group label {
    font-weight: 700;
    color: var(--text-dark);
    font-size: 0.85em;
    display: flex;
    align-items: center;
    gap: 5px;
    text-shadow: 0 1px 3px rgba(255, 255, 255, 0.8);
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.7);
    padding: 2px 6px;
    border-radius: 4px;
    width: fit-content;
    height: 24px;
    min-height: 24px;
    max-height: 24px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.form-group label .required {
    color: var(--danger-color);
}

/* Inputs */
.form-group input[type="text"],
.form-group input[type="password"],
.form-group input[type="number"],
.form-group input[type="email"],
.form-group input[type="file"],
.form-group select {
    padding: 10px 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    font-size: 0.9em;
    font-family: 'Montserrat', sans-serif;
    transition: all var(--transition-base);
    background-color: var(--background-white);
    color: var(--text-dark);
    width: 100%;
    box-sizing: border-box;
    height: 40px;
    min-height: 40px;
    max-height: 40px;
}

.form-group textarea {
    padding: 10px 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    font-size: 0.9em;
    font-family: 'Montserrat', sans-serif;
    transition: all var(--transition-base);
    background-color: var(--background-white);
    color: var(--text-dark);
    width: 100%;
    box-sizing: border-box;
    min-height: 70px;
    max-height: 120px;
    resize: vertical;
    line-height: 1.5;
}

.form-group input::placeholder {
    color: rgba(107, 114, 128, 0.7);
    font-weight: 400;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: var(--primary-color);
    border-width: 2px;
    box-shadow: 0 0 0 3px rgba(229, 91, 0, 0.1);
    outline: none;
}

.form-group input:disabled,
.form-group select:disabled,
.form-group textarea:disabled {
    background-color: #f5f5f5;
    cursor: not-allowed;
    opacity: 0.6;
}

/* Password wrapper */
.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 45px;
}

.password-toggle {
    position: absolute;
    top: 50%;
    right: 15px;
    transform: translateY(-50%);
    cursor: pointer;
    color: var(--primary-color);
    transition: all var(--transition-base);
    font-size: 1.2em;
    z-index: 2;
    text-shadow: none;
}

.password-toggle:hover {
    color: var(--primary-hover);
    transform: translateY(-50%) scale(1.2);
}

/* Champs de formulaire qui occupent toute la largeur */
.form-group.full-width {
    grid-column: 1 / -1;
}

/* Selects multiples avec hauteur fixe */
.form-group.select-multiple {
    grid-column: 1 / -1;
}

.form-group.select-multiple select {
    min-height: 200px;
    max-height: 200px;
}

/* Pour Select2 - ajuster la hauteur du conteneur */
.form-group.select-multiple .select2-container {
    min-height: 200px;
}

.form-group.select-multiple .select2-container .select2-selection--multiple {
    min-height: 200px !important;
    max-height: 200px !important;
    overflow-y: auto;
}

/* Boutons de formulaire */
form button[type="submit"],
form .btn-cancel {
    padding: 12px 28px;
    border: none;
    color: var(--text-light);
    border-radius: var(--border-radius);
    cursor: pointer;
    font-size: 0.95em;
    font-weight: 600;
    transition: all var(--transition-base);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

form button[type="submit"] {
    background: var(--primary-color);
}

form button[type="submit"]:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
}

form .btn-cancel {
    background: var(--secondary-color);
}

form .btn-cancel:hover {
    background: var(--secondary-hover);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
}

form button[type="submit"]:active,
form .btn-cancel:active {
    transform: translateY(0);
}

form button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

/* Styles pour Select2 (inchangés, ils sont spécifiques à la librairie) */
.select2-container--default .select2-selection--single {
    height: 44px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    display: flex;
    align-items: center;
}

.select2-container--default .select2-selection--single .select2-selection__rendered {
    line-height: 42px;
    padding-left: 12px;
}

.select2-container--default .select2-selection--single .select2-selection__arrow {
    height: 42px;
    right: 5px;
}

.select2-container--default.select2-container--focus .select2-selection--single {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
}

.select2-dropdown {
    border: 1px solid var(--border-color);
    border-radius: 4px;
    box-shadow: 0 2px 5px var(--shadow-light);
}

.select2-results__option {
    padding: 10px 12px;
}

.select2-results__option--highlighted[aria-selected] {
    background-color: var(--primary-color);
    color: var(--text-light);
}

/* ===== NOTIFICATIONS TOAST ===== */
.toast-container {
    position: fixed;
    top: 90px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.toast {
    min-width: 300px;
    padding: 16px 20px;
    background: var(--card-background);
    border-radius: var(--border-radius);
    box-shadow: var(--shadow-xl);
    display: flex;
    align-items: center;
    gap: 12px;
    animation: slideIn 0.3s ease;
    border-left: 4px solid;
}

.toast.success {
    border-left-color: var(--success-color);
}

.toast.error {
    border-left-color: var(--danger-color);
}

.toast.warning {
    border-left-color: var(--warning-color);
}

.toast.info {
    border-left-color: var(--info-color);
}

.toast-icon {
    font-size: 1.3em;
}

.toast.success .toast-icon {
    color: var(--success-color);
}

.toast.error .toast-icon {
    color: var(--danger-color);
}

.toast.warning .toast-icon {
    color: var(--warning-color);
}

.toast.info .toast-icon {
    color: var(--info-color);
}

.toast-content {
    flex: 1;
}

.toast-title {
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--text-dark);
}

.toast-message {
    font-size: 0.9em;
    color: var(--text-muted);
}

.toast-close {
    cursor: pointer;
    color: var(--text-muted);
    font-size: 1.2em;
    transition: all var(--transition-fast);
    padding: 4px;
}

.toast-close:hover {
    color: var(--text-dark);
    transform: scale(1.2);
}

@keyframes slideIn {
    from {
        transform: translateX(400px);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

@keyframes slideOut {
    from {
        transform: translateX(0);
        opacity: 1;
    }
    to {
        transform: translateX(400px);
        opacity: 0;
    }
}

/* ===== RESPONSIVE DESIGN ===== */
@media (max-width: 768px) {
    header {
        padding: 0 15px;
        height: 60px;
    }

    header h1 {
        font-size: 1.1em;
    }

    .header-subtitle {
        display: none;
    }

    .user-info {
        display: none;
    }

    .container {
        width: 100%;
        margin: 15px 0;
    }

    #contentArea {
        padding: 15px;
    }

    nav {
        flex-direction: column;
        padding: 15px;
    }

    nav button {
        width: 100%;
    }

    .form-row {
        grid-template-columns: 1fr;
    }

    h2 {
        font-size: 1.4em;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }

    .table-wrapper {
        max-height: 400px;
    }

    .toast-container {
        top: 70px;
        right: 10px;
        left: 10px;
    }

    .toast {
        min-width: auto;
    }
}

@media (max-width: 480px) {
    body {
        padding-top: 60px;
    }

    .logo-container {
        width: 35px;
        height: 35px;
    }

    .logout-btn {
        padding: 8px 12px;
        font-size: 0.85em;
    }

    .logout-btn span {
        display: none;
    }
}
    </style>
</head>
<body>
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <header>
        <div class="header-left">
            <div class="logo-container">
                <img src="./resources/images/care_logo.png" alt="CARE Logo">
            </div>
            <div>
                <h1>
                    Espace Administrateur
                    <div class="header-subtitle">Gestion des Données</div>
                </h1>
            </div>
        </div>
        <div class="header-right">
            <div class="user-info hidden" id="userInfo">
                <div class="user-avatar" id="userAvatar">A</div>
                <span id="userName">Administrateur</span>
            </div>
            <button class="logout-btn hidden" id="btnLogout">
                <i class="fas fa-power-off"></i>
                <span>Déconnexion</span>
            </button>
        </div>
    </header>

    <div class="container">
        <section id="loginSection">
            <h2>Connexion</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur :</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe :</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required>
                        <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                    </div>
                </div>
                <button type="submit">Se connecter</button>
            </form>
        </section>

        <section id="adminInterface" class="hidden">
            <nav>
                <button id="btnListRegions">
                    <i class="fas fa-map-marked-alt"></i> Régions
                </button>
                <button id="btnListPartners">
                    <i class="fas fa-handshake"></i> Partenaires
                </button>
                <button id="btnListProjects">
                    <i class="fas fa-project-diagram"></i> Projets
                </button>
            </nav>
            <div id="contentArea">
                <div class="table-wrapper">
                </div>
            </div>
        </section>
    </div>

    <script>
        // ===== FONCTION TOAST NOTIFICATION =====
        function showToast(message, type = 'info', duration = 4000) {
            const toastContainer = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };

            const titles = {
                success: 'Succès',
                error: 'Erreur',
                warning: 'Attention',
                info: 'Information'
            };

            toast.innerHTML = `
                <div class="toast-icon">
                    <i class="fas ${icons[type]}"></i>
                </div>
                <div class="toast-content">
                    <div class="toast-title">${titles[type]}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <div class="toast-close">
                    <i class="fas fa-times"></i>
                </div>
            `;

            toastContainer.appendChild(toast);

            // Fermeture au clic
            toast.querySelector('.toast-close').addEventListener('click', () => {
                removeToast(toast);
            });

            // Auto-suppression après durée
            setTimeout(() => {
                removeToast(toast);
            }, duration);
        }

        function removeToast(toast) {
            toast.style.animation = 'slideOut 0.3s ease';
            setTimeout(() => {
                toast.remove();
            }, 300);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const togglePassword = document.getElementById('togglePassword');
            const passwordField = document.getElementById('password');
            const userInfo = document.getElementById('userInfo');
            const btnLogout = document.getElementById('btnLogout');

            if (togglePassword && passwordField) {
                togglePassword.addEventListener('click', () => {
                    const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordField.setAttribute('type', type);
                    togglePassword.classList.toggle('fa-eye');
                    togglePassword.classList.toggle('fa-eye-slash');
                });
            }

            // Gestion de la déconnexion
            if (btnLogout) {
                btnLogout.addEventListener('click', async () => {
                    try {
                        const response = await fetch('/admin/api/logout', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' }
                        });
                        if (response.ok) {
                            showToast('Déconnexion réussie', 'success');
                            setTimeout(() => {
                                window.location.href = '/admin.html';
                            }, 1000);
                        } else {
                            showToast('Erreur lors de la déconnexion', 'error');
                        }
                    } catch (error) {
                        showToast('Erreur réseau lors de la déconnexion', 'error');
                    }
                });
            }

            // Gérer les boutons de navigation actifs
            const navButtons = document.querySelectorAll('nav button');
            navButtons.forEach(button => {
                button.addEventListener('click', () => {
                    navButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                });
            });

            // Définir le bouton "Régions" comme actif par défaut au chargement de l'interface admin
            const adminInterface = document.getElementById('adminInterface');
            const observer = new MutationObserver((mutationsList, observer) => {
                for (const mutation of mutationsList) {
                    if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                        if (!adminInterface.classList.contains('hidden')) {
                            document.getElementById('btnListRegions').classList.add('active');
                            // Afficher les infos utilisateur et bouton logout
                            userInfo.classList.remove('hidden');
                            btnLogout.classList.remove('hidden');
                            observer.disconnect();
                        }
                    }
                }
            });
            observer.observe(adminInterface, { attributes: true });
        });
    </script>
    <script src="/admin.js"></script>
</body>
</html>
